suite: Shared Infisical connection
templates:
  - templates/connection.yaml
release:
  name: infisical-secrets-operator
  namespace: default
tests:
  - it: is disabled by default
    asserts:
      - hasDocuments:
          count: 0
  - it: uses the configured address and name
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - isKind:
          of: InfisicalConnection
      - equal:
          path: metadata.name
          value: fake-connection
      - equal:
          path: metadata.namespace
          value: default
      - equal:
          path: spec.address
          value: https://infisical.example.test/api
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: infisical-secrets-operator
