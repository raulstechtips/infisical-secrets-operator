suite: Infisical rights for namespace admins
templates:
  - templates/admin-aggregate-clusterrole.yaml
release:
  name: infisical-secrets-operator
  namespace: default
tests:
  - it: is rendered with default values and aggregates to admin
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: infisical-secrets-operator-aggregate-to-admin
      - equal:
          path: metadata.labels["rbac.authorization.k8s.io/aggregate-to-admin"]
          value: "true"
  - it: grants full rights on the namespaced Infisical resources only
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [secrets.infisical.com]
              resources:
                - infisicalauths
                - infisicalconnections
                - infisicaldynamicsecrets
                - infisicalpushsecrets
                - infisicalsecrets
                - infisicalstaticsecrets
              verbs: [get, list, watch, create, update, patch, delete, deletecollection]
